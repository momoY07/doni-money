name: simple_ledger
description: "Doni Money - Simple and beautiful finance tracker"
publish_to: 'none'

version: 1.3.0+10

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.6
  shared_preferences: ^2.3.2
  in_app_purchase: ^3.2.3
  flutter_dynamic_icon: ^2.1.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.9
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dog_theme/
    - assets/images/app_icon/
    - assets/images/minimal_black/
    - assets/images/cyber_ai/
    - assets/images/categories/otter/
    - assets/images/categories/dog/
    - assets/images/categories/cyber/